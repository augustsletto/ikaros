[project]
name = "ikaros"
version = "0.1.0"
description = "High-performance inference server for Hugging Face models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
    "fastapi>=0.136.1",
    "locust>=2.44.0",
    "numpy>=2.4.4",
    "onnxruntime>=1.26.0",
    "optimum[onnxruntime]>=2.1.0",
    "prometheus-client>=0.25.0",
    "sentencepiece>=0.2.1",
    "torch>=2.12.0",
    "transformers>=4.57.6",
    "uvicorn>=0.46.0",
]

[tool.uv]
override-dependencies = ["triton; sys_platform == 'linux'"]
