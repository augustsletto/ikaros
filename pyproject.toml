[project]
name = "ikaros"
version = "0.1.0"
description = "High-performance inference server for Hugging Face models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "onnxruntime>=1.26.0",
    "optimum[onnxruntime]>=2.1.0",
    "sentencepiece>=0.2.1",
    "torch>=2.12.0",
    "transformers>=4.57.6",
]

[tool.uv]
override-dependencies = ["triton; sys_platform == 'linux'"]